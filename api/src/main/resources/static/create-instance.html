<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Create Instance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">CPD Instances</a>
    </div>
</nav>

<div class="container py-5">
    <h2 class="mb-4">Create New Instance</h2>

    <form id="createForm" class="card p-4 shadow rounded-4">
        <div class="mb-3">
            <label for="ip" class="form-label">IP adress</label>
            <input type="text" class="form-control" id="ip" required placeholder="Ej: 192.168.1.10">
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select class="form-select" id="status" name="status" required>
                <option value="ACTIVE">ACTIVE</option>
                <option value="INACTIVE">INACTIVE</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Create</button>
    </form>

    <div id="message" class="mt-4"></div>
</div>

<script>
    document.getElementById('createForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const data = {
            ip: document.getElementById('ip').value,
            status: document.getElementById('status').value
        };

        try {
            const response = await fetch("http://localhost:8080/instances", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            if (!response.ok) throw new Error("Failed to create a instance");

            const result = await response.json();
            document.getElementById('message').innerHTML = `<div class="alert alert-success">Instance created successfully: ID ${result.id}</div>`;
            document.getElementById('createForm').reset();
        } catch (error) {
            document.getElementById('message').innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
        }
    });
</script>

</body>
</html>
