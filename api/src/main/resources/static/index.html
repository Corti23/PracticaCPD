<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CPD Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4">Data Processing Center</h1>
        <!-- Create Instance --> 
        <div class="card mb-4">
            <div class="card-header">Create new instance</div>
            <div class="card-body">
                <form id="createInstanceForm">
                    <div class="mb-3">
                    <label for="instanceName" class="form-label">Server name</label>
                    <input type="text" class="form-control" id="instanceName" placeholder="Ej. MyInstance01" required>
                    </div>

                    <div class="mb-3">
                    <label for="memory" class="form-label">Memory (MB)</label>
                    <input type="number" class="form-control" id="memory" placeholder="Ej. 4096" required>
                    </div>

                    <div class="mb-3">
                    <label for="cores" class="form-label">Cores</label>
                    <input type="number" class="form-control" id="cores" placeholder="Ej. 2" required>
                    </div>

                    <div class="mb-3">
                    <label for="diskSize" class="form-label">Disk size (GB)</label>
                    <input type="number" class="form-control" id="diskSize" placeholder="Ej. 100" required>
                    </div>

                    <div class="mb-3">
                    <label for="diskType" class="form-label">Disk type</label>
                    <select class="form-select" id="diskType" required>
                        <option value="">Select a type...</option>
                        <option value="SSD">SSD</option>
                        <option value="HDD">HDD</option>
                    </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Create Instance</button>
                </form>
            </div>
        </div>

        <!-- List Instances -->
        <div class="card mb-4">
            <div class="card-header">Existing Instances</div>

            <div class="card-body">
                <button onclick="loadInstances()" class="btn btn-secondary mb-3">Refresh Instances</button>

                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Cores</th>
                            <th>Memory</th>
                            <th>IP</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="instancesTable"></tbody>
                </table>
            </div>
        </div>

        <!-- List Discos -->
        <div class="card mb-4">
            <div class="card-header">Existing Disks</div>

            <div class="card-body">
                <button onclick="loadDisks()" class="btn btn-secondary mb-3">Refresh Disk</button>

                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Size</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="disksTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost";

        // Crear instancia
        const createForm = document.getElementById("createInstanceForm");

        createForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const data = {
                name: document.getElementById("instanceName").value,
                cores: document.getElementById("cores").value,
                memory: document.getElementById("memory").value,
                diskSize: document.getElementById("diskSize").value,
                diskType: document.getElementById("diskType").value
            };

            const response = await fetch(`${API_BASE}/instances`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const location = response.headers.get("Location");

                alert(`Instance created at ${location}`);
                createForm.reset();
            } else {
                alert("Error creating the instance.");
            }
        });

        // Cargar instancias
        async function loadInstances() {
            const res = await fetch(`${API_BASE}/instances`);
            const data = await res.json();

            const table = document.getElementById("instancesTable");
            table.innerHTML = "";

            data.content.forEach(instance => {
                table.innerHTML += `
                    <tr>
                        <td>${instance.id}</td>
                        <td>${instance.name}</td>
                        <td>${instance.cores}</td>
                        <td>${instance.memory}</td>
                        <td>${instance.ip || '-'}</td>
                        <td>${instance.status}</td>
                        <td>
                            <button class="btn btn-danger btn-sm" onclick="deleteInstance('${instance.id}')">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function deleteInstance(id) {
            if (confirm("Delete this instance?")) {
                const res = await fetch(`${API_BASE}/instances/${id}`, { method: "DELETE" });

                if (res.ok) {
                    loadInstances();
                    loadDisks();
                } else {
                    alert("The instance could not be deleted.");
                }
            }
        }

        // Load disks
        async function loadDisks() {
            const res = await fetch(`${API_BASE}/disks`);
            const data = await res.json();

            const table = document.getElementById("disksTable");
            table.innerHTML = "";

            data.content.forEach(disk => {
                table.innerHTML += `
                    <tr>
                        <td>${disk.id}</td>
                        <td>${disk.size}</td>
                        <td>${disk.type}</td>
                        <td>${disk.status}</td>
                        <td>
                            ${disk.status === 'UNASSIGNED' ? `<button class="btn btn-danger btn-sm" onclick="deleteDisk('${disk.id}')">Delete</button>` : ''}
                        </td>
                    </tr>
                `;
            });
        }

        async function deleteDisk(id) {
            if (confirm("Delete this disk?")) {
                const res = await fetch(`${API_BASE}/disks/${id}`, { method: "DELETE" });
                
                if (res.ok) {
                    loadDisks();
                } else {
                    alert("The disk could not be deleted (maybe it is assigned?).");
                }
            }
        }

        loadInstances();
        loadDisks()
    </script>
</body>
</html>
