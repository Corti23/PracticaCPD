<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Instances</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">Registered Instances</h1>
        <button class="btn btn-primary" onclick="loadInstances()">Refresh</button>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>IP</th>
                    <th>Status</th>
                    <th>Timestamp</th>
                    <th>Update</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody id="instanceTableBody">
            </tbody>
        </table>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <form id="editForm" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editModalLabel">Edit Instance</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="editId">

                    <div class="mb-3">
                        <label for="editIp" class="form-label">IP</label>
                        <input type="text" class="form-control" id="editIp" required>
                    </div>

                    <div class="mb-3">
                        <label for="editStatus" class="form-label">Status</label>
                        <select class="form-select" id="editStatus" required>
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="INACTIVE">INACTIVE</option>
                        </select>
                    </div>

                    <input type="hidden" id="editTimeStamp">
                </div>

                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Save changes</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="toast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">
                    Action completed successfully.
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

</div>

<script>
    function loadInstances() {
        axios.get('/instances')
            .then(response => {
                const instances = response.data;
                const tableBody = document.getElementById('instanceTableBody');
                tableBody.innerHTML = '';

                instances.forEach(instance => {
                    const row = `<tr>
                        <td>${instance.id}</td>
                        <td>${instance.ip}</td>
                        <td>${instance.status}</td>
                        <td>${instance.timestamp ? instance.timestamp.replace('T', ' ').slice(0, 19) : ''}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="updateInstance(${instance.id})">Edit</button>
                        </td>
                        <td>
                            <button class="btn btn-danger btn-sm" onclick="deleteInstance(${instance.id})">Delete</button>
                        </td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error(error);
                showToast('Error loading the instances.', true);
            });
    }

    function updateInstance(id) {
        fetch(`/instances/${id}`)
            .then(response => response.json())
            .then(instance => {
                document.getElementById("editId").value = instance.id;
                document.getElementById("editIp").value = instance.ip;
                document.getElementById("editStatus").value = instance.status;
                document.getElementById("editTimeStamp").value = instance.timestamp;
                new bootstrap.Modal(document.getElementById("editModal")).show();
            });
    }

    document.getElementById("editForm").addEventListener("submit", function (e) {
        e.preventDefault();
        const id = document.getElementById("editId").value;
        const ip = document.getElementById("editIp").value;
        const status = document.getElementById("editStatus").value;
        const timestamp = document.getElementById("editTimeStamp").value;

        fetch(`/instances`, {
            method: "POST",
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: Number(id), ip, status, timestamp })
        })
        .then(response => {
            if (response.ok) {
                bootstrap.Modal.getInstance(document.getElementById("editModal")).hide();
                showToast("Instance updated successfully.");
                loadInstances();
            } else {
                showToast("Error updating the instance.", true);
            }
        });
    });

    function deleteInstance(id) {
        if (confirm('Are you sure you want to delete this instance?')) {
            axios.delete(`/instances/${id}`)
                .then(() => {
                    showToast('Instance deleted successfully.');
                    loadInstances();
                })
                .catch(error => {
                    console.error(error);
                    showToast('Error deleting the instance.', true);
                });
        }
    }

    function showToast(message, isError = false) {
        const toastEl = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        toastMessage.textContent = message;
        toastEl.classList.remove('text-bg-success', 'text-bg-danger');
        toastEl.classList.add(isError ? 'text-bg-danger' : 'text-bg-success');

        const toast = new bootstrap.Toast(toastEl);
        toast.show();
    }

    window.onload = loadInstances;
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
