<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Instance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow rounded-4">
        <div class="card-header bg-danger text-white text-center">
            <h3>Delete Instance</h3>
        </div>
        <div class="card-body">
            <form id="deleteInstanceForm">
                <div class="mb-3">
                    <label for="id" class="form-label">Instance ID</label>
                    <input type="number" id="id" name="id" class="form-control" placeholder="Enter Instance ID" required placeholder="Ej: 1">
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-danger btn-lg">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById('deleteInstanceForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const id = document.getElementById('id').value.trim();

    if (!id) {
        Swal.fire('Error', 'Please, enter a valid ID.', 'error');
        return;
    }

    const confirmResult = await Swal.fire({
        title: 'Are you sure?',
        text: "This action will permanently delete the instance!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'Yes, delete',
        cancelButtonText: 'Cancel'
    });

    if (!confirmResult.isConfirmed) {
        return;
    }

    try {
        const response = await fetch(`http://localhost:8080/instances/${id}`, {
            method: 'DELETE'
        });

        if (response.ok) {
            Swal.fire('Delete', 'The instance was deleted succesfully.', 'success');
            document.getElementById('deleteInstanceForm').reset();
        } else if (response.status === 404) {
            Swal.fire('Error', 'No instance found with that ID.', 'error');
        } else {
            throw new Error('Unexpected error trying to delete.');
        }
    } catch (error) {
        Swal.fire('Error', error.message, 'error');
    }
});
</script>

</body>
</html>
